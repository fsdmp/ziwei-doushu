<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雾见 MISTSEE</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #120d22;
    color: #9a8fb8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* 漂移的雾层：两层模糊径向渐变缓慢游移（与小程序雾紫视觉同源） */
  .fog { position: fixed; inset: -20%; pointer-events: none; filter: blur(60px); opacity: .55; }
  .fog--a { background: radial-gradient(40% 30% at 30% 40%, #241a3f 0%, transparent 70%); animation: drift-a 26s ease-in-out infinite alternate; }
  .fog--b { background: radial-gradient(35% 28% at 72% 62%, #1b1430 0%, transparent 70%); animation: drift-b 32s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate3d(-4%, -3%, 0) scale(1); } to { transform: translate3d(5%, 4%, 0) scale(1.15); } }
  @keyframes drift-b { from { transform: translate3d(4%, 3%, 0) scale(1.1); } to { transform: translate3d(-5%, -4%, 0) scale(1); } }

  .stage { position: relative; text-align: center; padding: 0 48px; }
  .mark { font-size: 44px; color: #6f5fa8; animation: glow 4s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .5; } to { opacity: 1; } }
  h1 { margin-top: 40px; font-size: 22px; font-weight: 500; letter-spacing: .35em; text-indent: .35em; color: #b9aede; }
  .sub { margin-top: 18px; font-size: 13px; letter-spacing: .18em; line-height: 2.1; color: #6b5d91; }
  .brand { position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); font-size: 11px; letter-spacing: .3em; text-align: center; color: #4d4270; }
  @media (prefers-reduced-motion: reduce) { .fog, .mark { animation: none; } }
</style>
</head>
<body>
  <div class="fog fog--a"></div>
  <div class="fog fog--b"></div>
  <main class="stage">
    <div class="mark">✦</div>
    <h1>雾尚未散开</h1>
    <p class="sub">新的板块正在筹备中<br>待雾起时 自会相见</p>
  </main>
  <footer class="brand">雾见 MISTSEE</footer>
</body>
</html>
