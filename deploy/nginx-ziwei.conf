# ziwei 静态站服务器端配置（8.140.235.234 真实拓扑，非本文件直装）
#
# 线上不是裸 nginx conf.d：443 由 APISIX 终结（*.offiai.cn 通配符证书），按 host
# 分流到两个独立 openresty 实例（每个实例自带 prefix 目录与日志）：
#
#   APISIX route "ziwei"      (host ziwei.offiai.cn)      → 127.0.0.1:8003
#   APISIX route "test-ziwei" (host test-ziwei.offiai.cn) → 127.0.0.1:8005
#
#   实例目录（listen / root）：
#     /usr/local/ziwei-static      实例 conf/nginx.conf：listen 127.0.0.1:8003, root html/
#     /usr/local/test-ziwei-static 实例 conf/nginx.conf：listen 127.0.0.1:8005, root html/
#   （test 实例 conf 从 prod 实例复制，只改 listen 端口与 root；两者 location 规则
#   完全一致，见下方「server 块内容」）
#
# 新增环境 = 复制一份实例目录 + 改端口/root + APISIX 加一条同款 route。
# APISIX route 定义（proxy-rewrite 仅补 X-Forwarded-Proto: https）：
#   curl http://127.0.0.1:9180/apisix/admin/routes/<id> -H "X-API-KEY: ..."（key 在
#   /usr/local/apisix/conf/config.yaml admin_key 段）
#
# ─── server 块内容（两实例一致，供比对/重建）────────────────────────────────
#
