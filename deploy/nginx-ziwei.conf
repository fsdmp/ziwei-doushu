# ziwei 静态站：正式 ziwei.offiai.cn + 测试 test-ziwei.offiai.cn（同机同 nginx，
# 只按域名/目录区分；放到 nginx conf.d/ 或 sites-enabled/）
# 产物：make build → out/ → make upload（rsync --delete 但已排除 MP_verify_*.txt
# 与 .well-known/，微信业务域名校验文件安全）：
#   正式 → /usr/local/ziwei-static/html/      （make upload，默认 ENV=prod）
#   测试 → /usr/local/ziwei-static/html-test/ （make upload ENV=test）
#
# 无 UA 门禁：小程序专属限制由前端代码实现（app/layout.tsx 首帧脚本，
# 非小程序 UA 跳 /open-in-mini.html 引导扫码进小程序）
#
# 证书：两段复用同一对证书文件。若现网证书不是 *.offiai.cn 通配符（不含
# test-ziwei 子域），需先换通配符证书或为 test-ziwei 单独签发再改下面两行，
# 否则 web-view 会因证书域名不匹配白屏。

server {
    listen 80;
    server_name ziwei.offiai.cn test-ziwei.offiai.cn;
    return 301 https://$host$request_uri;
}

# ─── 正式环境 ziwei.offiai.cn ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ziwei.offiai.cn;

    # 按实际证书路径修改（offiai.cn 通配符/多域证书与 mistsee 同源时复用同两行）
    ssl_certificate     /etc/nginx/cert/offiai.cn.pem;
    ssl_certificate_key /etc/nginx/cert/offiai.cn.key;

    root /usr/local/ziwei-static/html;
    index index.html;

    # Next 静态导出生成 chart.html 式文件：/chart 需要 $uri.html 兜底解析
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带内容 hash 的静态资源：长缓存。
    # ^~ 必须带：否则下面的 \.html$ 正则会抢走 /_next/static/xxx.html 的命中、丢掉长缓存
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存：更新即生效（门禁脚本改动也能即时下发）
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ─── 测试环境 test-ziwei.offiai.cn（make release ENV=test 的落点）───────────
# 与正式站完全同形：同一对证书、同一套缓存策略，只有 server_name 与 root 不同。
# 只对 mistsee gray 白名单用户下发（服务端 GET /ziwei/web 按 uid 切 URL），
# 但站点本身无访问控制——拿到域名谁都能看，勿放敏感内容。
server {
    listen 443 ssl http2;
    server_name test-ziwei.offiai.cn;

    ssl_certificate     /etc/nginx/cert/offiai.cn.pem;
    ssl_certificate_key /etc/nginx/cert/offiai.cn.key;

    root /usr/local/ziwei-static/html-test;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
