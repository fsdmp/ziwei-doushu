#         expires 7d;
#         add_header Cache-Control "public";
#         try_files $uri =404;
#     }
#
#     # HTML 不缓存,发版即时生效
#     location ~* \.html$ {
#         add_header Cache-Control "no-cache, no-store, must-revalidate";
#     }
#
#     location = / {
#         add_header Cache-Control "no-cache, no-store, must-revalidate";
#         try_files /index.html =404;
#     }
#
#     location / {
#         # 无扩展名的 SSG 页面(/chart 等):必须带缓存头,
