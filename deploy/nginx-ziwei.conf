# ziwei.offiai.cn 静态站（放到 nginx conf.d/ 或 sites-enabled/）
# 产物：make build → out/ → make upload（rsync --delete 但已排除 MP_verify_*.txt
# 与 .well-known/，微信业务域名校验文件安全）→ 落到 /usr/local/ziwei-static/html/
#
# 无 UA 门禁：小程序专属限制由前端代码实现（app/layout.tsx 首帧脚本，
# 非小程序 UA 跳 /open-in-mini.html 引导扫码进小程序）

server {
    listen 80;
    server_name ziwei.offiai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ziwei.offiai.cn;

    # 按实际证书路径修改（offiai.cn 通配符/多域证书与 mistsee 同源时复用同两行）
    ssl_certificate     /etc/nginx/cert/offiai.cn.pem;
    ssl_certificate_key /etc/nginx/cert/offiai.cn.key;

    root /usr/local/ziwei-static/html;
    index index.html;

    # Next 静态导出生成 chart.html 式文件：/chart 需要 $uri.html 兜底解析
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带内容 hash 的静态资源：长缓存。
    # ^~ 必须带：否则下面的 \.html$ 正则会抢走 /_next/static/xxx.html 的命中、丢掉长缓存
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存：更新即生效（门禁脚本改动也能即时下发）
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
